name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Triggers only pushing a tag like v1.0.0 or v0.5.0-custom.1

# Repository secrets used to sign the APK (Settings > Secrets and variables > Actions):
# - KEYSTORE_BASE64: the release keystore, base64 encoded (`base64 -w0 release.jks`)
# - KEYSTORE_PASS: the keystore password
# - KEY_ALIAS: the key alias in the keystore (optional, defaults to librefit_release)
# - KEY_PASS: the key password (optional, defaults to KEYSTORE_PASS)
# Keep the same keystore for every release, or installed copies cannot be updated.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload files to Releases

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_BASE64 and KEYSTORE_PASS secrets are needed to sign the release. See the top of .github/workflows/release.yml."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build unsigned release APK
        env:
          SOURCE_DATE_EPOCH: 1700000000
        # --no-daemon ensures a fresh, reproducible environment in CI
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'librefit_release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS || secrets.KEYSTORE_PASS }}
        run: |
          # Decode keystore from Base64
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

          # Rename unsigned apk
          mv "app/build/outputs/apk/release/LibreFit-release-unsigned.apk" "app/build/outputs/apk/release/LibreFit-unsigned.apk"

          UNSIGNED_APK="app/build/outputs/apk/release/LibreFit-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/LibreFit-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/LibreFit.apk"
          # The newest build tools installed on the runner
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "Using build tools in $BUILD_TOOLS_DIR"

          # Align to 16KB (Capital P is required for build tools 36+)
          "$BUILD_TOOLS_DIR/zipalign" -f -P 16 -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign with preservation: --alignment-preserved prevents apksigner from changing the padding bytes
          # Use "env:" to pass passwords securely without exposing them in CI logs
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --alignment-preserved \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$SIGNED_APK"

          # Clean up the keystore
          rm release.jks

      # This is just for testing the manual run
      - name: Upload artifacts if not releasing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/LibreFit.apk
          archive: false

      # It extracts the notes of the latest version in CHANGELOG.md
      - name: Extract release notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LibreFit ${{ github.ref_name }}
          files: app/build/outputs/apk/release/LibreFit.apk
          body: ${{ steps.extract_notes.outputs.release_notes }}
          append_body: true # List new contributors
